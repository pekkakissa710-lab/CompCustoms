<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CompCustoms - Hallinta</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 400px; margin: 20px 0; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: none; box-sizing: border-box; }
    button { background: #0078f2; color: white; font-weight: bold; cursor: pointer; }
    .hidden { display: none; }
    ul { list-style: none; padding: 0; }
    li { background: #2a2a2a; padding: 10px; margin-bottom: 8px; border-radius: 4px; }
  </style>
</head>
<body>

  <h1>CompCustoms</h1>

  <div id="login-section" class="card">
    <h2>Syötä Admin Secret</h2>
    <input type="password" id="secret-input" placeholder="Syötä secret...">
    <button onclick="authenticate()">Kirjaudu</button>
    <p id="login-status" style="color: red;"></p>
  </div>

  <div id="admin-section" class="card hidden">
    <h2>Lisää Turnaus</h2>
    <input type="text" id="t-name" placeholder="Turnauksen nimi">
    <input type="text" id="t-game" placeholder="Peli (esim. Fortnite)">
    <input type="datetime-local" id="t-date">
    <button onclick="addTournament()">Lisää turnaus</button>
  </div>

  <div class="card">
    <h2>Tulevat turnaukset</h2>
    <ul id="tournament-list"></ul>
  </div>

  <script>
    const API_URL = 'https://compcustoms-api.onrender.com'; // Vaihda tähän oma Render-osoitteesi
    let savedSecret = '';

    // Kirjautumisen tarkistus
    async function authenticate() {
      const secret = document.getElementById('secret-input').value;
      const res = await fetch(`${API_URL}/api/admin/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret })
      });

      const data = await res.json();
      if (data.success) {
        savedSecret = secret;
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('admin-section').classList.remove('hidden');
        loadTournaments();
      } else {
        document.getElementById('login-status').innerText = 'Väärä secret!';
      }
    }

    // Turnauksen lisäys
    async function addTournament() {
      const name = document.getElementById('t-name').value;
      const game = document.getElementById('t-game').value;
      const date = document.getElementById('t-date').value;

      const res = await fetch(`${API_URL}/api/tournaments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: savedSecret, name, game, date })
      });

      const data = await res.json();
      if (data.success) {
        alert('Turnaus lisätty!');
        loadTournaments();
      } else {
        alert('Virhe: ' + data.message);
      }
    }

    // Hae turnaukset
    async function loadTournaments() {
      const res = await fetch(`${API_URL}/api/tournaments`);
      const tournaments = await res.json();
      const list = document.getElementById('tournament-list');
      list.innerHTML = '';
      
      tournaments.forEach(t => {
        const li = document.createElement('li');
        li.innerText = `${t.name} (${t.game}) - ${new Date(t.date).toLocaleString()}`;
        list.appendChild(li);
      });
    }

    // Lataa turnaukset sivun avautuessa
    loadTournaments();
  </script>

</body>
</html>
