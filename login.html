<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMPCUSTOMS - Account</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient-to-b from-[#050B14] via-[#0A1128] to-black text-slate-100 min-h-screen font-sans antialiased flex items-center justify-center p-4">

    <div id="popup-overlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-center">
            <div id="popup-icon" class="w-12 h-12 mx-auto rounded-xl flex items-center justify-center"></div>
            <p id="popup-message" class="text-sm text-slate-300 leading-relaxed"></p>
            <button onclick="closePopup()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-sm transition-all">OK</button>
        </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-8 shadow-2xl space-y-6">
        <div class="flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-2 text-slate-400 hover:text-white text-xs font-semibold uppercase tracking-wider">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Back to Hub</span>
            </a>
            <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
                <button onclick="switchTab('login')" id="tab-login" class="px-3 py-1 text-xs font-bold rounded-lg bg-blue-600 text-white transition-all">Login</button>
                <button onclick="switchTab('register')" id="tab-register" class="px-3 py-1 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all">Register</button>
            </div>
        </div>

        <div class="space-y-1">
            <h1 id="form-title" class="text-2xl font-black text-white tracking-wide">Welcome Back</h1>
            <p class="text-xs text-amber-400 font-semibold bg-amber-500/10 border border-amber-500/20 p-2.5 rounded-xl leading-relaxed">
                ⚠️ For your safety, don't use your Epic password here!
            </p>
            <p id="display-name-warning" class="hidden text-xs text-red-400 font-semibold bg-red-500/10 border border-red-500/20 p-2.5 rounded-xl leading-relaxed">
                Please use your actual EPIC GAMES display name. Using someone else's display name won't benefit you in any way and results in a ban.
            </p>
        </div>

        <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Username</label>
                <input type="text" id="input-username" required placeholder="Your Epic display name" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="input-password" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>
            <button type="submit" id="submit-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-sm transition-all shadow-lg shadow-blue-600/20">Login</button>
        </form>
    </div>

    <script>
        lucide.createIcons();
        const API_BASE = "https://compcustoms-api.onrender.com";
        let currentMode = 'login';

        function showPopup(message, type) {
            var overlay = document.getElementById('popup-overlay');
            var msgEl = document.getElementById('popup-message');
            var iconEl = document.getElementById('popup-icon');
            msgEl.textContent = message;
            if (type === 'error') {
                iconEl.className = 'w-12 h-12 mx-auto rounded-xl flex items-center justify-center bg-red-600/20 border border-red-500/30 text-red-400';
                iconEl.innerHTML = '<i data-lucide="alert-circle" class="w-6 h-6"></i>';
            } else {
                iconEl.className = 'w-12 h-12 mx-auto rounded-xl flex items-center justify-center bg-emerald-600/20 border border-emerald-500/30 text-emerald-400';
                iconEl.innerHTML = '<i data-lucide="check-circle" class="w-6 h-6"></i>';
            }
            lucide.createIcons();
            overlay.classList.remove('hidden');
        }

        function closePopup() {
            document.getElementById('popup-overlay').classList.add('hidden');
        }

        function switchTab(mode) {
            currentMode = mode;
            var title = document.getElementById('form-title');
            var submitBtn = document.getElementById('submit-btn');
            var tabLogin = document.getElementById('tab-login');
            var tabRegister = document.getElementById('tab-register');
            var warning = document.getElementById('display-name-warning');

            if (mode === 'login') {
                title.textContent = "Welcome Back";
                submitBtn.textContent = "Login";
                warning.classList.add('hidden');
                tabLogin.className = "px-3 py-1 text-xs font-bold rounded-lg bg-blue-600 text-white transition-all";
                tabRegister.className = "px-3 py-1 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all";
            } else {
                title.textContent = "Create Account";
                submitBtn.textContent = "Register";
                warning.classList.remove('hidden');
                tabRegister.className = "px-3 py-1 text-xs font-bold rounded-lg bg-blue-600 text-white transition-all";
                tabLogin.className = "px-3 py-1 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all";
            }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            var username = document.getElementById('input-username').value.trim();
            var password = document.getElementById('input-password').value;

            if (!username || !password) {
                showPopup("Username and password are required.", "error");
                return;
            }

            try {
                var endpoint = currentMode === 'login' ? '/api/auth/login' : '/api/auth/register';
                var res = await fetch(API_BASE + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                var data = await res.json();

                if (data.success) {
                    localStorage.setItem('epic_authenticated', 'true');
                    localStorage.setItem('epic_username', username);
                    window.location.href = 'index.html';
                } else {
                    showPopup(data.message || "An error occurred.", "error");
                }
            } catch (err) {
                showPopup("Connection error. Make sure the backend server is running.", "error");
                console.error(err);
            }
        }
    </script>
</body>
</html>
