<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMPCUSTOMS - Secret Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-6">
        
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-blue-600/20 border border-blue-500/30 rounded-xl text-blue-400">
                <i data-lucide="shield-alert" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white">Secret Admin Panel</h1>
                <p class="text-xs text-slate-400">CompCustoms Match Management</p>
            </div>
        </div>

        <div id="auth-step" class="space-y-4">
            <p class="text-slate-400 text-sm">Syötä salainen <strong>Client Secret</strong> avataksesi hallinnan.</p>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Admin Secret</label>
                <input type="password" id="secret-input" placeholder="Syötä secret..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 text-sm">
            </div>
            <button onclick="handleLogin()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-sm transition-all shadow-lg shadow-blue-600/20">
                Kirjaudu Sisään
            </button>
        </div>

        <div id="create-step" class="space-y-4 hidden">
            <div class="p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-emerald-400 text-xs font-semibold uppercase tracking-wider flex items-center gap-2">
                <i data-lucide="check-circle" class="w-4 h-4"></i> Autentikointi Onnistui
            </div>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Name</label>
                    <input type="text" id="m-name" placeholder="esim. Friday Night Customs" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Custom Code</label>
                    <input type="text" id="m-code" placeholder="esim. COMP123" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 text-sm font-mono uppercase">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Description</label>
                    <textarea id="m-desc" rows="3" placeholder="Säännöt, palvelin, tilaus jne..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 text-sm"></textarea>
                </div>
            </div>

            <button onclick="handleCreateMatch()" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl text-sm transition-all shadow-lg shadow-blue-600/20">
                🚀 Julkaise Matsi
            </button>
        </div>

    </div>

    <script>
        lucide.createIcons();
        const API_BASE = "https://compcustoms-api.onrender.com";
        let activeSecret = '';

        async function handleLogin() {
            const secret = document.getElementById('secret-input').value;
            if (!secret) return alert('Syötä secret!');

            try {
                const res = await fetch(`${API_BASE}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ secret })
                });

                if (res.ok) {
                    activeSecret = secret;
                    document.getElementById('auth-step').classList.add('hidden');
                    document.getElementById('create-step').classList.remove('hidden');
                } else {
                    alert('Väärä Admin Secret!');
                }
            } catch (err) {
                alert('Yhteysvirhe palvelimeen!');
            }
        }

        async function handleCreateMatch() {
            const name = document.getElementById('m-name').value;
            const customCode = document.getElementById('m-code').value;
            const description = document.getElementById('m-desc').value;

            if (!name || !customCode) return alert('Täytä vähintään nimi ja koodi!');

            try {
                const res = await fetch(`${API_BASE}/api/tournaments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        secret: activeSecret,
                        name,
                        customCode,
                        description
                    })
                });

                if (res.ok) {
                    alert('Matsi julkaistu!');
                    document.getElementById('m-name').value = '';
                    document.getElementById('m-code').value = '';
                    document.getElementById('m-desc').value = '';
                } else {
                    alert('Virhe julkaisussa.');
                }
            } catch (err) {
                alert('Tapahtui virhe.');
            }
        }
    </script>
</body>
</html>
