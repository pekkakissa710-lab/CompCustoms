<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMPCUSTOMS - Secret Admin</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans selection:bg-blue-600 selection:text-white">

    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-6 relative z-10 overflow-hidden">
        
        <div class="flex items-center space-x-3">
            <div class="p-2.5 bg-blue-600/20 border border-blue-500/30 rounded-xl text-blue-400 shrink-0">
                <i data-lucide="shield-alert" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-wide">Secret Admin Panel</h1>
                <p class="text-xs text-slate-400">CompCustoms Match Management</p>
            </div>
        </div>

        <div id="auth-step" class="space-y-4">
            <p class="text-slate-400 text-xs sm:text-sm leading-relaxed">
                Syötä salainen <strong class="text-slate-200">Client Secret</strong> avataksesi hallinnan.
            </p>
            <div class="space-y-1">
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Admin Secret</label>
                <input type="password" id="secret-input" placeholder="Syötä secret..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 text-sm transition-colors">
            </div>
            <button onclick="handleLogin()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-sm transition-all shadow-lg shadow-blue-600/20 active:scale-95">
                Kirjaudu Sisään
            </button>
        </div>

        <div id="create-step" class="space-y-6 hidden">
            <div class="p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-emerald-400 text-xs font-semibold uppercase tracking-wider flex items-center gap-2">
                <i data-lucide="check-circle" class="w-4 h-4"></i> Autentikointi Onnistui
            </div>
            
            <div class="space-y-4">
                <h2 class="text-xs font-extrabold text-slate-400 uppercase tracking-wider border-b border-slate-800 pb-2">Luo uusi matsi</h2>
                
                <div class="space-y-1">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Match Name</label>
                    <input type="text" id="m-name" placeholder="esim. Friday Night Customs" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 text-sm">
                </div>

                <div class="space-y-1">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Custom Code</label>
                    <input type="text" id="m-code" placeholder="esim. COMP123" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 text-sm font-mono uppercase">
                </div>

                <div class="space-y-1">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Päivämäärä & Kellonaika</label>
                    <input type="datetime-local" id="m-time" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 text-sm">
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Team Size</label>
                        <select id="m-team" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-white text-xs focus:outline-none focus:border-blue-500">
                            <option value="SOLO">SOLO</option>
                            <option value="DUO">DUO</option>
                            <option value="TRIO">TRIO</option>
                            <option value="SQUAD">SQUAD</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Mode</label>
                        <select id="m-mode" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-white text-xs focus:outline-none focus:border-blue-500">
                            <option value="BATTLE ROYALE">BATTLE ROYALE</option>
                            <option value="RELOAD">RELOAD</option>
                            <option value="OG">OG</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Submode</label>
                        <select id="m-submode" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-white text-xs focus:outline-none focus:border-blue-500">
                            <option value="BUILDS">BUILDS</option>
                            <option value="ZERO BUILDS">ZERO BUILDS</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Description / Rules</label>
                    <textarea id="m-desc" rows="3" placeholder="Muut lisätiedot ja säännöt..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 text-sm"></textarea>
                </div>

                <button onclick="handleCreateMatch()" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl text-sm transition-all shadow-lg shadow-blue-600/20 active:scale-95">
                    🚀 Julkaise Matsi
                </button>
            </div>

            <div class="space-y-3 pt-4 border-t border-slate-800">
                <h2 class="text-xs font-extrabold text-slate-400 uppercase tracking-wider">Aktiiviset matsit</h2>
                <div id="admin-matches-list" class="space-y-2 max-h-52 overflow-y-auto pr-1">
                    <p class="text-xs text-slate-500">Ladataan matseja...</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();
        const API_BASE = "https://compcustoms-api.onrender.com";
        let activeSecret = '';

        async function handleLogin() {
            const secret = document.getElementById('secret-input').value;
            if (!secret) return alert('Syötä secret!');

            try {
                const res = await fetch(`${API_BASE}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ secret })
                });

                if (res.ok) {
                    activeSecret = secret;
                    document.getElementById('auth-step').classList.add('hidden');
                    document.getElementById('create-step').classList.remove('hidden');
                    loadAdminMatches();
                } else {
                    alert('Väärä Admin Secret!');
                }
            } catch (err) {
                alert('Yhteysvirhe palvelimeen!');
            }
        }

        async function handleCreateMatch() {
            const name = document.getElementById('m-name').value;
            const customCode = document.getElementById('m-code').value;
            const startTime = document.getElementById('m-time').value;
            const teamSize = document.getElementById('m-team').value;
            const mode = document.getElementById('m-mode').value;
            const submode = document.getElementById('m-submode').value;
            const description = document.getElementById('m-desc').value;

            if (!name || !customCode || !startTime) {
                return alert('Täytä vähintään nimi, koodi ja kellonaika!');
            }

            try {
                const res = await fetch(`${API_BASE}/api/tournaments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        secret: activeSecret,
                        name,
                        customCode,
                        startTime,
                        teamSize,
                        mode,
                        submode,
                        description
                    })
                });

                if (res.ok) {
                    alert('Matsi julkaistu onnistuneesti!');
                    document.getElementById('m-name').value = '';
                    document.getElementById('m-code').value = '';
                    document.getElementById('m-time').value = '';
                    document.getElementById('m-desc').value = '';
                    loadAdminMatches();
                } else {
                    alert('Virhe julkaisussa.');
                }
            } catch (err) {
                alert('Tapahtui virhe palvelinyhteydessä.');
            }
        }

        async function loadAdminMatches() {
            const listElem = document.getElementById('admin-matches-list');
            try {
                const res = await fetch(`${API_BASE}/api/tournaments`);
                const matches = await res.json();

                if (matches.length === 0) {
                    listElem.innerHTML = '<p class="text-xs text-slate-500">Ei aktiivisia matseja.</p>';
                    return;
                }

                listElem.innerHTML = '';
                matches.forEach(m => {
                    const row = document.createElement('div');
                    row.className = 'p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between gap-3';
                    row.innerHTML = `
                        <div class="min-w-0 flex-1">
                            <span class="text-xs font-bold text-white block truncate">${m.name}</span>
                            <span class="text-[10px] text-slate-400 font-mono block truncate">${m.customCode} • ${m.teamSize} • ${m.mode}</span>
                        </div>
                        <button onclick="deleteMatch(${m.id})" class="px-3 py-1.5 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/30 text-xs font-bold rounded-lg transition-all shrink-0">
                            Poista
                        </button>
                    `;
                    listElem.appendChild(row);
                });
            } catch (err) {
                listElem.innerHTML = '<p class="text-xs text-red-400">Virhe ladattaessa matseja.</p>';
            }
        }

        async function deleteMatch(id) {
            if (!confirm('Haluatko varmasti poistaa tämän matsin?')) return;

            try {
                const res = await fetch(`${API_BASE}/api/tournaments/${id}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ secret: activeSecret })
                });

                if (res.ok) {
                    loadAdminMatches();
                } else {
                    alert('Poisto epäonnistui.');
                }
            } catch (err) {
                alert('Yhteysvirhe.');
            }
        }
    </script>
</body>
</html>

</html>
